<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leandro Cardoso Jiu-Jitsu</title>
<meta name="theme-color" content="#0E1B22">
<meta name="description" content="Gestão de alunos, mensalidades e presença da academia Leandro Cardoso Jiu-Jitsu">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --tatame:#0E1B22; --tatame2:#152731; --tatame3:#1D323D; --linha:#274451;
    --dourado:#C9A227; --douradoClaro:#E4C25C; --vermelho:#B3221E; --verde:#3E7C5A;
    --texto:#F4F1EA; --muted:#9FB2BA;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--tatame);color:var(--texto);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  .topbar{height:4px;background:linear-gradient(90deg,var(--dourado),var(--vermelho) 60%,var(--dourado));}
  header{padding:20px 20px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--linha);}
  .backbtn{background:none;border:none;color:var(--muted);padding:8px;margin-left:-8px;display:flex;}
  .htitle{flex:1;min-width:0;}
  .eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.2em;color:var(--dourado);margin:0;}
  .mainname{font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .subname{font-size:14px;color:var(--muted);margin:0;}
  .screentitle{font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .newbtn{display:flex;align-items:center;gap:6px;background:var(--dourado);color:#151515;border:none;border-radius:4px;padding:9px 12px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;}
  .installbtn{background:none;border:1px solid var(--dourado);color:var(--dourado);border-radius:4px;padding:8px 12px;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;}
  .banner{margin:12px 20px 0;border-radius:4px;padding:10px 12px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .banner.ok{background:rgba(62,124,90,.15);border:1px solid var(--verde);color:#7FD3A4;}
  .banner.error{background:rgba(179,34,30,.15);border:1px solid var(--vermelho);color:#F0938F;}
  .banner button{background:none;border:none;color:inherit;display:flex;}
  main{padding:20px 20px 40px;}
  .max-w{max-width:640px;margin:0 auto;}
  .stack{display:flex;flex-direction:column;gap:24px;}
  .stack-sm{display:flex;flex-direction:column;gap:10px;}
  .stack-xs{display:flex;flex-direction:column;gap:8px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .statchip{background:var(--tatame2);border:1px solid var(--linha);border-radius:4px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .statchip .value{font-size:26px;font-weight:900;}
  .statchip .value.warn{color:#F0938F;}
  .statchip .label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:center;}
  .navcard{display:flex;align-items:center;gap:14px;background:var(--tatame2);border:1px solid var(--linha);border-radius:4px;padding:18px;text-align:left;width:100%;color:var(--texto);}
  .navcard .icowrap{width:48px;height:48px;background:var(--tatame3);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--dourado);}
  .navcard .body{flex:1;min-width:0;}
  .navcard .title{font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin:0;}
  .navcard .desc{font-size:13px;color:var(--muted);margin:2px 0 0;}
  .navcard .chev{color:var(--muted);flex-shrink:0;}
  .searchbar{display:flex;align-items:center;gap:8px;background:var(--tatame2);border:1px solid var(--linha);border-radius:4px;padding:10px 12px;}
  .searchbar svg{color:var(--muted);flex-shrink:0;}
  .searchbar input{flex:1;background:none;border:none;outline:none;color:var(--texto);font-size:14px;}
  .studentcard{display:flex;align-items:center;gap:12px;background:var(--tatame2);border:1px solid var(--linha);border-radius:4px;padding:14px;width:100%;text-align:left;color:var(--texto);}
  .avatar{width:44px;height:44px;border-radius:4px;background:var(--tatame3);color:var(--dourado);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex-shrink:0;}
  .avatar.lg{width:64px;height:64px;font-size:20px;}
  .scbody{flex:1;min-width:0;}
  .scname{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;}
  .paybadge{display:inline-flex;align-items:center;gap:4px;border-radius:3px;padding:3px 8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;flex-shrink:0;}
  .paybadge.ok{background:rgba(62,124,90,.18);color:#7FD3A4;border:1px solid var(--verde);}
  .paybadge.bad{background:rgba(179,34,30,.18);color:#F0938F;border:1px solid var(--vermelho);}
  .emptystate{background:var(--tatame2);border:1px dashed var(--linha);border-radius:4px;padding:34px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;}
  .emptystate .t{font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin:0;}
  .emptystate .d{font-size:14px;color:var(--muted);max-width:280px;margin:0;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;}
  .field label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .field input[type=text], .field input[type=date], .field textarea{background:var(--tatame);border:1px solid var(--linha);color:var(--texto);border-radius:4px;padding:11px 12px;font-size:14px;outline:none;width:100%;}
  .field textarea{resize:none;}
  .field input:focus, .field textarea:focus{border-color:var(--dourado);}
  .form-error{color:var(--vermelho);font-size:13px;margin:-8px 0 14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .beltpicker{display:flex;flex-wrap:wrap;gap:8px;}
  .beltbtn{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--linha);border-radius:4px;padding:8px 10px;color:var(--muted);font-size:13px;}
  .beltbtn.active{background:var(--tatame3);border-color:var(--dourado);color:var(--texto);}
  .stripepicker-row{display:flex;align-items:center;gap:12px;}
  .stripepicker{display:flex;gap:6px;}
  .stripebtn{width:32px;height:32px;border-radius:4px;background:var(--tatame2);border:1px solid var(--linha);color:var(--muted);font-weight:800;font-size:14px;}
  .stripebtn.active{background:var(--dourado);border-color:var(--dourado);color:#111;}
  .paybuttons{display:flex;gap:8px;}
  .paybtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:4px;padding:11px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;background:none;border:1px solid var(--linha);color:var(--muted);}
  .paybtn.ok.active{background:rgba(62,124,90,.2);border-color:var(--verde);color:#7FD3A4;}
  .paybtn.bad.active{background:rgba(179,34,30,.2);border-color:var(--vermelho);color:#F0938F;}
  .formactions{display:flex;gap:12px;margin-top:8px;}
  .btn-outline{flex:1;border-radius:4px;padding:13px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;background:none;border:1px solid var(--linha);color:var(--muted);}
  .btn-danger-outline{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:4px;padding:13px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;background:none;border:1px solid var(--vermelho);color:#F0938F;}
  .btn-primary{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:4px;padding:13px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;background:var(--dourado);border:none;color:#151515;}
  .detailcard{background:var(--tatame2);border:1px solid var(--linha);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:16px;}
  .detailhead{display:flex;align-items:center;gap:16px;}
  .detailname{font-size:20px;font-weight:900;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .paymentrow{display:flex;align-items:center;justify-content:space-between;background:var(--tatame3);border-radius:4px;padding:12px 14px;}
  .paymentrow .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0;}
  .paymentrow .val{font-size:14px;margin:3px 0 0;}
  .paymentrow button{background:none;border:1px solid var(--linha);border-radius:4px;padding:6px 10px;}
  .inforow{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);}
  .notebox{font-size:14px;background:var(--tatame3);color:var(--muted);border-radius:4px;padding:12px;margin:0;}
  .historycard{background:var(--tatame2);border:1px solid var(--linha);border-radius:4px;padding:16px;}
  .historycard .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px;}
  .historytags{display:flex;flex-wrap:wrap;gap:6px;}
  .historytag{font-size:12px;background:var(--tatame3);color:var(--muted);border-radius:3px;padding:4px 8px;}
  .actionsrow{display:flex;gap:12px;}
  .datebar{display:flex;align-items:center;gap:10px;background:var(--tatame2);border:1px solid var(--linha);border-radius:4px;padding:12px 14px;}
  .datebar input{background:none;border:none;outline:none;color:var(--texto);font-size:14px;flex:1;}
  .datebar svg{color:var(--dourado);flex-shrink:0;}
  .counter{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;}
  .attrow{display:flex;align-items:center;gap:12px;background:var(--tatame2);border:1px solid var(--linha);border-radius:4px;padding:12px;width:100%;text-align:left;color:var(--texto);}
  .attrow.checked{background:rgba(201,162,39,.12);border-color:var(--dourado);}
  .checkbox{width:24px;height:24px;border-radius:4px;border:1px solid var(--linha);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .checkbox.on{background:var(--dourado);border-color:var(--dourado);}
  .attname{flex:1;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal-box{width:100%;max-width:380px;background:var(--tatame2);border:1px solid var(--vermelho);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:14px;}
  .modal-box .t{font-weight:900;text-transform:uppercase;margin:0;}
  .modal-box .d{font-size:14px;color:var(--muted);margin:0;}
  .modal-actions{display:flex;gap:12px;}
  .modal-actions button{flex:1;border-radius:4px;padding:11px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;}
  .btn-cancel{background:none;border:1px solid var(--linha);color:var(--muted);}
  .btn-confirm-danger{background:var(--vermelho);border:none;color:var(--texto);}
</style>
</head>
<body>
<div class="topbar"></div>
<div id="app"></div>

<script>
/* ===================== Dados / estado ===================== */
const STORAGE_STUDENTS = "lcjj_students";
const STORAGE_ATTENDANCE = "lcjj_attendance";

const BELTS = {
  Branca: { bg:"#F4F1EA", bar:"#111111" },
  Azul:   { bg:"#1E4FA3", bar:"#F4F1EA" },
  Roxa:   { bg:"#5B2A86", bar:"#F4F1EA" },
  Marrom: { bg:"#5A3A1E", bar:"#F4F1EA" },
  Preta:  { bg:"#111111", bar:"#C9A227" },
};
const BELT_ORDER = ["Branca","Azul","Roxa","Marrom","Preta"];

const state = {
  screen: "home",
  students: [],
  attendance: {},
  selectedId: null,
  editingId: null,
  search: "",
  attDate: todayStr(),
  checked: new Set(),
  confirmDeleteId: null,
  banner: null,
};

function todayStr(){ return new Date().toISOString().slice(0,10); }
function formatDateBR(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
function initials(name){ return (name||"").trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(""); }
function escapeHtml(str){ return (str||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return "s_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function loadData(){
  try{ state.students = JSON.parse(localStorage.getItem(STORAGE_STUDENTS) || "[]"); }catch(e){ state.students = []; }
  try{ state.attendance = JSON.parse(localStorage.getItem(STORAGE_ATTENDANCE) || "{}"); }catch(e){ state.attendance = {}; }
}
function saveStudentsStorage(){
  try{ localStorage.setItem(STORAGE_STUDENTS, JSON.stringify(state.students)); }
  catch(e){ flash("Não foi possível salvar os dados dos alunos.", "error"); }
}
function saveAttendanceStorage(){
  try{ localStorage.setItem(STORAGE_ATTENDANCE, JSON.stringify(state.attendance)); }
  catch(e){ flash("Não foi possível salvar a chamada.", "error"); }
}

/* ===================== Ícones (svg minimalistas) ===================== */
const ICONS = {
  check: '<path d="M20 6 9 17l-5-5"/>',
  alert: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
  arrowLeft: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',
  chevronRight: '<polyline points="9 18 15 12 9 6"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  clipboard: '<path d="M9 2h6a1 1 0 0 1 1 1v2H8V3a1 1 0 0 1 1-1z"/><rect x="4" y="4" width="16" height="18" rx="2"/><path d="m9 14 2 2 4-4"/>',
  userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>',
  save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
};
function icon(name, size=16, color="currentColor"){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||""}</svg>`;
}

/* ===================== Componentes visuais ===================== */
function beltTagHTML(belt, stripes, size){
  const b = BELTS[belt] || BELTS.Branca;
  const dims = size==="sm" ? {w:56,h:16,tip:14} : size==="lg" ? {w:110,h:28,tip:24} : {w:80,h:20,tip:18};
  let notches = "";
  for(let i=0;i<4;i++){
    notches += `<span style="display:inline-block;width:3px;height:${dims.tip}px;background:${i<stripes?b.bar:"transparent"};opacity:${i<stripes?1:0};border-radius:1px;margin-left:2px;"></span>`;
  }
  const border = belt==="Branca" ? "border:1px solid var(--linha);" : "";
  return `<span style="display:inline-flex;align-items:center;height:${dims.h}px;flex-shrink:0;">
    <span style="width:${dims.w}px;height:${dims.h}px;background:${b.bg};border-radius:3px;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;${border}">${notches}</span>
  </span>`;
}
function paymentBadgeHTML(status){
  const pago = status === "pago";
  return `<span class="paybadge ${pago?"ok":"bad"}">${icon(pago?"check":"alert",12)} ${pago?"Pago":"Pendente"}</span>`;
}
function emptyStateHTML(title, text, actionLabel, onAction){
  return `<div class="emptystate">
    <p class="t">${escapeHtml(title)}</p>
    <p class="d">${escapeHtml(text)}</p>
    ${actionLabel ? `<button class="newbtn" onclick="${onAction}">${escapeHtml(actionLabel)}</button>` : ""}
  </div>`;
}
function flash(text, tone){
  state.banner = { text, tone: tone || "ok" };
  renderBanner();
  setTimeout(() => { state.banner = null; renderBanner(); }, 3000);
}
function renderBanner(){
  const el = document.getElementById("bannerSlot");
  if(!el) return;
  el.innerHTML = state.banner ? `
    <div class="banner ${state.banner.tone}">
      <span>${escapeHtml(state.banner.text)}</span>
      <button onclick="state.banner=null;renderBanner();">${icon("x",14)}</button>
    </div>` : "";
}

/* ===================== Navegação ===================== */
function go(screen){ state.screen = screen; render(); }
function openNew(){ state.editingId = null; go("form"); }
function openEdit(id){ state.editingId = id; go("form"); }
function selectStudent(id){ state.selectedId = id; go("detail"); }
function cancelForm(){ go(state.editingId ? "detail" : "students"); }

/* ===================== Ações ===================== */
function togglePayment(id){
  state.students = state.students.map(s => s.id===id ? {...s, paymentStatus: s.paymentStatus==="pago"?"pendente":"pago"} : s);
  saveStudentsStorage();
  render();
}
function askDelete(id){ state.confirmDeleteId = id; render(); }
function cancelDeleteModal(){ state.confirmDeleteId = null; render(); }
function doDelete(id){
  state.students = state.students.filter(s => s.id !== id);
  saveStudentsStorage();
  state.confirmDeleteId = null;
  go("students");
  flash("Aluno removido.");
}

function onSearchInput(v){
  state.search = v;
  const el = document.getElementById("studentsListContainer");
  if(el) el.innerHTML = studentsListInnerHTML();
}
function toggleAttendee(id){
  if(state.checked.has(id)) state.checked.delete(id); else state.checked.add(id);
  const list = document.getElementById("attendanceListContainer");
  if(list) list.innerHTML = attendanceListInnerHTML();
  const counter = document.getElementById("attCounter");
  if(counter) counter.textContent = `${state.checked.size} / ${state.students.length} presentes`;
}
function onAttDateChange(v){
  state.attDate = v;
  state.checked = new Set(state.attendance[v] || []);
  go("attendance");
}
function doSaveAttendance(){
  state.attendance = { ...state.attendance, [state.attDate]: Array.from(state.checked) };
  saveAttendanceStorage();
  flash(`Chamada de ${formatDateBR(state.attDate)} salva — ${state.checked.size} presença(s).`);
}

function pickBelt(b){
  document.getElementById("f_belt").value = b;
  document.getElementById("beltPicker").innerHTML = BELT_ORDER.map(x => beltPickerBtnHTML(x, x===b)).join("");
  const stripes = Number(document.getElementById("f_stripes").value);
  document.getElementById("stripePreview").innerHTML = beltTagHTML(b, stripes, "lg");
}
function pickStripes(n){
  document.getElementById("f_stripes").value = n;
  document.getElementById("stripePicker").innerHTML = [0,1,2,3,4].map(x => stripeBtnHTML(x, x===n)).join("");
  const belt = document.getElementById("f_belt").value;
  document.getElementById("stripePreview").innerHTML = beltTagHTML(belt, n, "lg");
}
function setPayStatus(v){
  document.getElementById("f_pay").value = v;
  document.getElementById("pay_pago").classList.toggle("active", v==="pago");
  document.getElementById("pay_pendente").classList.toggle("active", v!=="pago");
}
function submitForm(){
  const nameInput = document.getElementById("f_name");
  const name = nameInput.value.trim();
  const errEl = document.getElementById("formError");
  if(!name){ errEl.style.display="block"; errEl.textContent="Informe o nome do aluno."; nameInput.focus(); return; }
  errEl.style.display = "none";
  const data = {
    id: state.editingId || undefined,
    name,
    phone: document.getElementById("f_phone").value.trim(),
    belt: document.getElementById("f_belt").value,
    stripes: Number(document.getElementById("f_stripes").value),
    joinDate: document.getElementById("f_join").value || todayStr(),
    fee: document.getElementById("f_fee").value.trim(),
    paymentStatus: document.getElementById("f_pay").value,
    notes: document.getElementById("f_notes").value.trim(),
  };
  if(data.id){
    state.students = state.students.map(s => s.id===data.id ? {...s, ...data} : s);
    saveStudentsStorage();
    state.selectedId = data.id;
    go("detail");
    flash("Aluno atualizado.");
  } else {
    data.id = uid();
    state.students.push(data);
    saveStudentsStorage();
    go("students");
    flash("Aluno cadastrado.");
  }
}

/* ===================== Instalação PWA ===================== */
let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if(state.screen === "home") render();
});
function doInstall(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(() => { deferredInstallPrompt = null; render(); });
}

/* ===================== Render por tela ===================== */
function beltPickerBtnHTML(b, active){
  return `<button type="button" class="beltbtn ${active?"active":""}" onclick="pickBelt('${b}')">${beltTagHTML(b,0,"sm")}<span>${b}</span></button>`;
}
function stripeBtnHTML(n, active){
  return `<button type="button" class="stripebtn ${active?"active":""}" onclick="pickStripes(${n})">${n}</button>`;
}

function renderHome(){
  const pendingCount = state.students.filter(s => s.paymentStatus==="pendente").length;
  const todayCount = (state.attendance[todayStr()] || []).length;
  return `
    <div class="stack max-w">
      <div class="grid3">
        <div class="statchip"><span class="value">${state.students.length}</span><span class="label">Alunos</span></div>
        <div class="statchip"><span class="value ${pendingCount>0?"warn":""}">${pendingCount}</span><span class="label">Pendentes</span></div>
        <div class="statchip"><span class="value">${todayCount}</span><span class="label">Hoje no tatame</span></div>
      </div>
      <button class="navcard" onclick="go('students')">
        <span class="icowrap">${icon("users",22)}</span>
        <span class="body"><p class="title">Perfil dos alunos</p><p class="desc">Cadastrar, consultar e ver situação de pagamento</p></span>
        <span class="chev">${icon("chevronRight",20)}</span>
      </button>
      <button class="navcard" onclick="go('attendance')">
        <span class="icowrap">${icon("clipboard",22)}</span>
        <span class="body"><p class="title">Fazer chamada</p><p class="desc">Marcar quem compareceu na aula de hoje</p></span>
        <span class="chev">${icon("chevronRight",20)}</span>
      </button>
    </div>
  `;
}

function studentCardHTML(s){
  return `<button class="studentcard" onclick="selectStudent('${s.id}')">
    <span class="avatar">${initials(s.name)}</span>
    <span class="scbody">
      <p class="scname">${escapeHtml(s.name)}</p>
      <div style="margin-top:6px;">${beltTagHTML(s.belt, s.stripes, "sm")}</div>
    </span>
    ${paymentBadgeHTML(s.paymentStatus)}
  </button>`;
}
function studentsListInnerHTML(){
  if(state.students.length === 0){
    return emptyStateHTML("Nenhum aluno cadastrado","Cadastre o primeiro aluno da academia para começar a controlar mensalidades e presença.","Cadastrar aluno","openNew()");
  }
  const filtered = state.students.filter(s => s.name.toLowerCase().includes(state.search.toLowerCase()))
    .sort((a,b) => a.name.localeCompare(b.name, "pt-BR"));
  if(filtered.length === 0){
    return `<p style="text-align:center;color:var(--muted);font-size:14px;padding:32px 0;">Nenhum aluno encontrado para "${escapeHtml(state.search)}".</p>`;
  }
  return `<div class="stack-sm">${filtered.map(studentCardHTML).join("")}</div>`;
}
function renderStudents(){
  return `
    <div class="stack max-w">
      <div class="searchbar">
        ${icon("search",16)}
        <input id="searchInput" type="text" placeholder="Buscar aluno..." oninput="onSearchInput(this.value)" value="${escapeHtml(state.search)}">
      </div>
      <div id="studentsListContainer">${studentsListInnerHTML()}</div>
    </div>
  `;
}

function renderForm(){
  const s = state.editingId ? state.students.find(x => x.id===state.editingId) : null;
  const belt = (s && s.belt) || "Branca";
  const stripes = (s && s.stripes) || 0;
  return `
    <div class="max-w">
      <div id="formError" class="form-error" style="display:none;"></div>
      <div class="field">
        <label>Nome completo</label>
        <input id="f_name" type="text" placeholder="Ex: João Pereira da Silva" value="${escapeHtml(s?s.name:"")}">
      </div>
      <div class="field">
        <label>Telefone / WhatsApp</label>
        <input id="f_phone" type="text" placeholder="(11) 91234-5678" value="${escapeHtml(s?s.phone:"")}">
      </div>
      <div class="field">
        <label>Faixa</label>
        <div id="beltPicker" class="beltpicker">${BELT_ORDER.map(b => beltPickerBtnHTML(b, b===belt)).join("")}</div>
        <input type="hidden" id="f_belt" value="${belt}">
      </div>
      <div class="field">
        <label>Graus na faixa</label>
        <div class="stripepicker-row">
          <div id="stripePreview">${beltTagHTML(belt, stripes, "lg")}</div>
          <div id="stripePicker" class="stripepicker">${[0,1,2,3,4].map(n => stripeBtnHTML(n, n===stripes)).join("")}</div>
        </div>
        <input type="hidden" id="f_stripes" value="${stripes}">
      </div>
      <div class="grid2">
        <div class="field"><label>Data de matrícula</label><input id="f_join" type="date" value="${s?s.joinDate:todayStr()}"></div>
        <div class="field"><label>Mensalidade (R$)</label><input id="f_fee" type="text" placeholder="150,00" value="${escapeHtml(s?s.fee:"")}"></div>
      </div>
      <div class="field">
        <label>Situação do pagamento</label>
        <div class="paybuttons">
          <button type="button" id="pay_pago" class="paybtn ok ${(!s || s.paymentStatus==="pago")?"":""}${(s && s.paymentStatus==="pago")?" active":""}" onclick="setPayStatus('pago')">${icon("check",16)} Pago</button>
          <button type="button" id="pay_pendente" class="paybtn bad ${(!s || s.paymentStatus!=="pago")?"active":""}" onclick="setPayStatus('pendente')">${icon("alert",16)} Pendente</button>
        </div>
        <input type="hidden" id="f_pay" value="${s?s.paymentStatus:"pendente"}">
      </div>
      <div class="field">
        <label>Observações (opcional)</label>
        <textarea id="f_notes" rows="2" placeholder="Lesões, restrições, combinados...">${escapeHtml(s?s.notes:"")}</textarea>
      </div>
      <div class="formactions">
        <button type="button" class="btn-outline" onclick="cancelForm()">Cancelar</button>
        <button type="button" class="btn-primary" onclick="submitForm()">${icon("save",16)} Salvar</button>
      </div>
    </div>
  `;
}

function renderDetail(){
  const s = state.students.find(x => x.id===state.selectedId);
  if(!s){ go("students"); return ""; }
  const dates = Object.entries(state.attendance).filter(([,ids]) => ids.includes(s.id)).map(([d]) => d).sort((a,b) => a<b?1:-1);
  return `
    <div class="stack max-w">
      <div class="detailcard">
        <div class="detailhead">
          <span class="avatar lg">${initials(s.name)}</span>
          <div style="flex:1;min-width:0;">
            <p class="detailname">${escapeHtml(s.name)}</p>
            <div style="margin-top:8px;">${beltTagHTML(s.belt, s.stripes, "md")}</div>
          </div>
        </div>
        <div class="paymentrow">
          <div><p class="lbl">Mensalidade</p><p class="val">${s.fee ? "R$ "+escapeHtml(s.fee) : "Não informada"}</p></div>
          <button onclick="togglePayment('${s.id}')">${paymentBadgeHTML(s.paymentStatus)}</button>
        </div>
        ${s.phone ? `<div class="inforow">${icon("phone",15)} ${escapeHtml(s.phone)}</div>` : ""}
        <div class="inforow">${icon("calendar",15)} Matriculado em ${formatDateBR(s.joinDate)}</div>
        ${s.notes ? `<p class="notebox">${escapeHtml(s.notes)}</p>` : ""}
      </div>
      <div class="historycard">
        <p class="lbl">Presenças registradas (${dates.length})</p>
        ${dates.length===0 ? `<p style="font-size:14px;color:var(--muted);margin:0;">Nenhuma chamada com este aluno ainda.</p>` :
          `<div class="historytags">${dates.slice(0,12).map(d => `<span class="historytag">${formatDateBR(d)}</span>`).join("")}</div>`}
      </div>
      <div class="actionsrow">
        <button class="btn-outline" onclick="openEdit('${s.id}')">${icon("edit",15)} Editar</button>
        <button class="btn-danger-outline" onclick="askDelete('${s.id}')">${icon("trash",15)} Remover</button>
      </div>
    </div>
  `;
}

function attendeeRowHTML(s){
  const isChecked = state.checked.has(s.id);
  return `<button class="attrow ${isChecked?"checked":""}" onclick="toggleAttendee('${s.id}')">
    <span class="checkbox ${isChecked?"on":""}">${isChecked ? icon("check",15,"#151515") : ""}</span>
    <span class="attname">${escapeHtml(s.name)}</span>
    ${beltTagHTML(s.belt, s.stripes, "sm")}
  </button>`;
}
function attendanceListInnerHTML(){
  if(state.students.length === 0){
    return emptyStateHTML("Nenhum aluno cadastrado","Cadastre alunos primeiro para poder marcar presença nas aulas.","Cadastrar aluno","openNew()");
  }
  const sorted = [...state.students].sort((a,b) => a.name.localeCompare(b.name,"pt-BR"));
  return `<div class="stack-xs">${sorted.map(attendeeRowHTML).join("")}</div>`;
}
function renderAttendance(){
  state.checked = new Set(state.attendance[state.attDate] || []);
  return `
    <div class="stack max-w">
      <div class="datebar">
        ${icon("calendar",16)}
        <input id="attDateInput" type="date" value="${state.attDate}" onchange="onAttDateChange(this.value)">
        <span id="attCounter" class="counter">${state.checked.size} / ${state.students.length} presentes</span>
      </div>
      <div id="attendanceListContainer">${attendanceListInnerHTML()}</div>
      ${state.students.length>0 ? `<button class="btn-primary" style="margin-top:4px;" onclick="doSaveAttendance()">${icon("save",16)} Salvar chamada de ${formatDateBR(state.attDate)}</button>` : ""}
    </div>
  `;
}

function renderModals(){
  if(!state.confirmDeleteId) return "";
  return `
    <div class="modal-overlay" onclick="cancelDeleteModal()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <p class="t">Remover aluno?</p>
        <p class="d">Essa ação não pode ser desfeita. O histórico de presença deste aluno permanecerá nas chamadas antigas.</p>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="cancelDeleteModal()">Cancelar</button>
          <button class="btn-confirm-danger" onclick="doDelete('${state.confirmDeleteId}')">Remover</button>
        </div>
      </div>
    </div>
  `;
}

/* ===================== Render raiz ===================== */
function renderHeader(){
  const showBack = state.screen !== "home";
  let titleHTML = "";
  if(state.screen === "home"){
    titleHTML = `<p class="eyebrow">Academia</p><p class="mainname">Leandro Cardoso</p><p class="subname">Jiu-Jitsu</p>`;
  } else if(state.screen === "students"){
    titleHTML = `<p class="screentitle">Alunos</p>`;
  } else if(state.screen === "detail"){
    const s = state.students.find(x => x.id===state.selectedId);
    titleHTML = `<p class="screentitle">${s?escapeHtml(s.name):""}</p>`;
  } else if(state.screen === "form"){
    titleHTML = `<p class="screentitle">${state.editingId?"Editar aluno":"Novo aluno"}</p>`;
  } else if(state.screen === "attendance"){
    titleHTML = `<p class="screentitle">Fazer chamada</p>`;
  }
  const backTarget = state.screen==="detail" ? "students" : state.screen==="form" ? (state.editingId?"detail":"students") : "home";
  return `
    <header>
      ${showBack ? `<button class="backbtn" onclick="go('${backTarget}')">${icon("arrowLeft",20)}</button>` : ""}
      <div class="htitle">${titleHTML}</div>
      ${state.screen==="students" ? `<button class="newbtn" onclick="openNew()">${icon("userPlus",15)} Novo</button>` : ""}
      ${state.screen==="home" && deferredInstallPrompt ? `<button class="installbtn" onclick="doInstall()">Instalar app</button>` : ""}
    </header>
  `;
}
function renderScreen(){
  if(state.screen === "home") return renderHome();
  if(state.screen === "students") return renderStudents();
  if(state.screen === "form") return renderForm();
  if(state.screen === "detail") return renderDetail();
  if(state.screen === "attendance") return renderAttendance();
  return "";
}
function render(){
  const app = document.getElementById("app");
  app.innerHTML = `
    ${renderHeader()}
    <div id="bannerSlot"></div>
    <main>${renderScreen()}</main>
    ${renderModals()}
  `;
  renderBanner();
}

/* ===================== Boot ===================== */
loadData();
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
